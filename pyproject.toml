[project]
name = "phase-gate-mcp"
version = "2.0.0"
description = "Phase-Gate MCP Server — AI-assisted workflow orchestration with phase, cycle, and quality gate enforcement"
authors = [
    {name = "Phase Gate Team"}
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "mcp>=1.0.0,<2",
    "gitpython>=3.1.0",
    "PyGithub>=2.0.0",
    "jinja2>=3.1.2",
    "jsonschema>=4.20.0",
]

[project.scripts]
pgmcp = "mcp_server.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
    "black>=23.9.0",
    "pyright>=1.1.386",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*"]

[tool.setuptools.package-data]
mcp_server = [
    "assets/**/*",
    "assets/**/.*",
    "assets/**/.github/**/*",
    "bundled_adapters/**/*",
    "bundled_adapters/**/.*",
    "execution/contracts/*.json",
    "resources/cache_reading.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/mcp_server"]
norecursedirs = [".git", ".vscode", "__pycache__", "docs", "results", "source_data", "frontends", "locales"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-n", "auto",
]
# Coverage is opt-in; native source, branch and threshold defaults apply with --cov.
markers = [
    "slow: Fully hermetic tests that spawns real subprocesses or git operations on tmp_path. Enabled by default; skip via -m 'not slow' for fast dev-runs.",
    "manual: Manual tests requiring full environment setup and explicit enablement (RUN_MANUAL_TESTS=1)",
    "asyncio: Mark async tests for pytest-asyncio",
]
asyncio_mode = "strict"

[tool.mypy]
python_version = "3.11"
files = ["mcp_server"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/mcp_server/validation_fixtures"]

[tool.ruff.lint]
# Native Ruff settings shared by editor and adapter consumers.
select = [
    "E",   # pycodestyle errors - includes E501 (line-too-long)
    "W",   # pycodestyle warnings - includes W291/W292/W293 (whitespace)
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade - includes UP034 (extraneous-parens)
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "T20", # flake8-print
    "ISC", # flake8-implicit-str-concat
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PLC", # pylint-convention - includes PLC0415 (import-outside-top-level) for Gate 2
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG"]


[tool.coverage.run]
source = ["mcp_server"]
branch = true

[tool.coverage.report]
fail_under = 90

