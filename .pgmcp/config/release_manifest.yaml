version: "3.0.0"
assets:
  # Ship the generic basis and shared validation schemas, never workspace overrides.
  - source: ".pgmcp/config/defaults"
    target: "config/defaults"
  - source: ".pgmcp/config/check_schemas"
    target: "config/check_schemas"
  - source: ".pgmcp/template_suite"
    target: "template_suite"
  # Shared setup/instruction guidance is shipped through docs/setup and references.
  # Host-specific source examples are not target installation assets.
  - source: "docs/coding_standards"
    target: "docs/coding_standards"
  - source: "docs/manuals"
    target: "docs/manuals"
  # Explicit installable references; the release procedure remains workspace-only.
  - source: "docs/reference/tools"
    target: "docs/reference/tools"
