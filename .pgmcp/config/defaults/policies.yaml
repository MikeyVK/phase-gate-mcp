# pgmcp:v1 id=yaml_configuration pv=1.0.0 pf=PLMSEYmswjuR9tyD sf=KoFPQ3-cAAWFeesb

# Product configuration basis; workspace differences belong in the parent config directory.

"version": "1.0.0"
"operations":
  "scaffold":
    "description": "Create new component from template"
    "allowed_phases":
    - "design"
    - "implementation"
  "create_file":
    "description": "Create arbitrary file (non-scaffolded)"
    "allowed_phases": []
    "blocked_patterns":
    - "backend/**"
    - "mcp_server/tools/**"
    - "mcp_server/resources/**"
    - "mcp_server/adapters/**"
    - "mcp_server/workers/**"
    "allowed_extensions":
    - ".md"
    - ".txt"
    - ".json"
    - ".yaml"
    - ".yml"
    - ".sh"
    - ".ps1"
    - ".rst"
    - ".toml"
    - ".ini"
    - ".cfg"
  "commit":
    "description": "Git commit with message"
    "allowed_phases": []
    "require_tdd_prefix": true
