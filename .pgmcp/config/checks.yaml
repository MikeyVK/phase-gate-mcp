# Workspace overrides; inherited values are defined in defaults/.
checks:
  python_syntax:
    configuration_choice: not_applicable
  typescript_syntax:
    configuration_choice: not_applicable
  commit_message:
    configuration_choice: native_discovery
  python_format:
    configuration_choice: native_discovery
  python_lint:
    configuration_choice: native_discovery
  python_types:
    configuration_choice: native_discovery
  python_pyright:
    configuration_choice: native_discovery
  markdown_links:
    configuration_choice: configured_arguments
  yaml_configuration:
    configuration_choice: configured_arguments
  json_schema_shape:
    configuration_choice: configured_arguments
  json_schema_metaschema:
    configuration_choice: configured_arguments
configured_targets:
  python_production_sources:
    include:
    - mcp_server/**/*.py
    - mcp_server/**/*.pyi
  python_format_sources:
    exclude: &id001
    - tests/mcp_server/validation_fixtures/**
    - docs/development/archive/**
    - '**/.pytest_cache*/**'
    - '**/__pycache__/**'
  python_lint_sources:
    exclude: *id001
  yaml_sources:
    exclude: &id002
    - .pgmcp/temp/**
    - docs/development/archive/**
    - '**/__pycache__/**'
    - '**/.pytest_cache*/**'
    - '**/.venv/**'
    - '**/venv/**'
    - '**/node_modules/**'
    - build/**
    - dist/**
    - '**/*.egg-info/**'
  json_schema_sources:
    exclude: *id002
